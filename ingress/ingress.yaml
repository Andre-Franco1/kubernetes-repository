apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-service-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - "*.demo.com"
    secretName: demo-domain-secret
  rules:
  - host: nginx.demo.com
    http:
      paths:
      - path: /                       #/nginx(/|$)(.*)
        pathType: Prefix                #ImplementationSpecific
        backend:
          service:
            name: nginx
            port:
              number: 80
  - host: httpd.demo.com
    http:
      paths:
      - path: /                     #/httpd(/|$)(.*)
        pathType: Prefix                    #ImplementationSpecific
        backend:
          service:
            name: httpd
            port:
              number: 80